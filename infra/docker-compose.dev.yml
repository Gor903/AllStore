services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-allstore}
      POSTGRES_DB: ${POSTGRES_DB:-allstore}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allstore} -d ${POSTGRES_DB:-allstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # официальный образ MinIO публикуется на quay.io, не на Docker Hub
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      target: dev
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      BASE_DOMAIN: ${BASE_DOMAIN:-allstore.localhost}
      CORS_ORIGINS: http://localhost:${HTTP_PORT:-8080},http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-allstore}:${POSTGRES_PASSWORD:-allstore}@postgres:5432/${POSTGRES_DB:-allstore}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-allstore-dev}
      S3_PUBLIC_URL: http://localhost:${MINIO_PORT:-9000}/${S3_BUCKET:-allstore-dev}
    volumes:
      - ../backend:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:${HTTP_PORT:-8080}
      NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN:-allstore.localhost}
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/srv/app
      - frontend-node-modules:/srv/app/node_modules
      - frontend-next-cache:/srv/app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  minio-data:
  frontend-node-modules:
  frontend-next-cache:

# Куда приходит алерт. До этого файла источник был готов — строки лога пишутся с тех пор,
# как появился код, — а адресата не было, и поэтому пункты про алерты в трёх фазах плана
# стояли невыполненными.
route:
  receiver: nowhere
  # одно письмо на всплеск, а не на каждое срабатывание
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  # напоминание раз в четыре часа: алерт, который замолчал сам, выглядит как решённый
  repeat_interval: 4h

receivers:
  # Умолчание: алерт виден в /api/v2/alerts и больше нигде. Этого хватает, чтобы проверить
  # цепочку целиком, и не хватает, чтобы кто-то узнал о проблеме ночью.
  - name: nowhere

  # Телеграм — потому что бесплатен, не требует домена и доходит до телефона. Закомментирован
  # целиком, а не оставлен с пустым chat_id: Alertmanager проверяет и те приёмники, которыми
  # никто не пользуется, и падает на старте, если в них чего-то не хватает.
  #
  # Три шага: @BotFather → токен; написать своему боту что угодно; chat_id из
  # https://api.telegram.org/bot<токен>/getUpdates. Токен в репозиторий не кладут — положите
  # его в файл рядом и смонтируйте, а в `route.receiver` поставьте `telegram`.
  #
  # - name: telegram
  #   telegram_configs:
  #     - bot_token_file: /etc/alertmanager/telegram-token
  #       chat_id: <ваш chat_id>
  #       parse_mode: HTML
  #       message: |
  #         <b>{{ .CommonLabels.alertname }}</b>
  #         {{ range .Alerts }}{{ .Annotations.summary }}
  #         {{ .Annotations.description }}
  #         {{ end }}

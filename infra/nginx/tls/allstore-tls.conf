# Mounted into conf.d only by infra/docker-compose.https.yml. The stand itself stays on http:
# `__Host-` cookies need https, and a stand that needed a certificate to come up would be a
# stand nobody runs.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    client_max_body_size 10m;

    # self-signed and wildcard, made by infra/tls/generate-cert.sh; a browser will object once
    ssl_certificate /etc/nginx/tls/allstore.localhost.crt;
    ssl_certificate_key /etc/nginx/tls/allstore.localhost.key;

    include /etc/nginx/conf.d/routes.inc;
}

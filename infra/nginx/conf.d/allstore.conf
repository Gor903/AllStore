server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    # Docker's embedded DNS, asked again every ten seconds.
    #
    # Without this nginx resolves the service names once, at startup, and holds those
    # addresses for life. Compose hands a recreated container a new address, so every
    # `docker compose up --build` left nginx talking to an address nobody was listening on —
    # 502 on a perfectly healthy stack, until somebody thought to restart nginx. The names
    # therefore live in variables: a literal upstream is resolved at startup, a variable one
    # is resolved as it is used.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";
    set $frontend "frontend:3000";

    # Host is forwarded verbatim by proxy_headers.inc: store resolution by subdomain depends on it
    location /api/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$backend$request_uri;
    }

    # the assistant waits on a language model, which on a CPU thinks far longer than 60 seconds
    location /api/v1/assistant/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$backend$request_uri;
        proxy_read_timeout 180s;
        # the answer is streamed so the products arrive first; buffering would hold them back
        proxy_buffering off;
    }

    location /health {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$backend$request_uri;
    }

    location /docs {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$backend$request_uri;
    }

    location /openapi.json {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$backend$request_uri;
    }

    location / {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://$frontend$request_uri;
        # Next.js dev server pushes hot-reload updates over websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

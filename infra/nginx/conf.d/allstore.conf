upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 10m;

    # Host is forwarded verbatim by proxy_headers.inc: store resolution by subdomain depends on it
    location /api/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://backend_upstream;
    }

    # the assistant waits on a language model, which on a CPU thinks far longer than 60 seconds
    location /api/v1/assistant/ {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://backend_upstream;
        proxy_read_timeout 180s;
        # the answer is streamed so the products arrive first; buffering would hold them back
        proxy_buffering off;
    }

    location /health {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://backend_upstream;
    }

    location /docs {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://backend_upstream;
    }

    location /openapi.json {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://backend_upstream;
    }

    location / {
        include /etc/nginx/conf.d/proxy_headers.inc;
        proxy_pass http://frontend_upstream;
        # Next.js dev server pushes hot-reload updates over websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

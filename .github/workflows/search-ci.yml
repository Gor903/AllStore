name: search-ci

on:
  # ручной запуск: фильтры paths молчат, когда в пуше нет подходящих изменений
  workflow_dispatch:
  pull_request:
    paths:
      - "search/**"
      - "backend/alembic/**"
      - ".github/workflows/search-ci.yml"
  push:
    branches: [main]
    paths:
      - "search/**"
      - "backend/alembic/**"
      - ".github/workflows/search-ci.yml"

defaults:
  run:
    working-directory: search

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: allstore
          POSTGRES_PASSWORD: allstore
          POSTGRES_DB: allstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allstore -d allstore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://allstore:allstore@localhost:5432/allstore_test
      # the tests run on the deterministic stand-in: a two-gigabyte model download proves
      # nothing about this code, and the real one is exercised by hand on the stand
      EMBEDDER: fake

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: search/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      # the schema is owned by backend: the service tests run against it, not against a schema
      # of their own, so a migration that breaks the search is caught here
      - name: Apply backend migrations
        working-directory: backend
        env:
          APP_ENV: local
          SECRET_KEY: ci-secret-value-at-least-32-characters
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: ci
          S3_SECRET_KEY: ci
          S3_BUCKET: allstore-ci
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

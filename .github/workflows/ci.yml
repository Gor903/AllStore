# Один конвейер вместо четырёх workflow.
#
# Было: четыре файла с фильтрами путей, и `backend-ci` одной job'ой делал линт, типы, миграции,
# тесты, генерацию типов и покрытие — красная галочка не говорила, что именно сломалось. А
# фильтры приводили к тому, что инфраструктурный PR запускал только `e2e`, и три ожидаемые
# галочки просто не стартовали.
#
# Стало: по job'е на зону ответственности, все стартуют одновременно, и в защите ветки
# требуется одна галочка — `gate`. Список обязательных проверок не придётся править при
# добавлении job'ы.
#
# Команды живут в Makefile, а не здесь: добавить линтер значит дописать строку в цель, которую
# и так гоняют локально и pre-commit. Этот файл при этом не меняется.
name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Отменять предыдущий прогон того же PR, но никогда — прогон на main: история main должна
# остаться полной.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # то, что backend/tests/conftest.py ждёт в окружении; APP_ENV=local, потому что тесты
  # проверяют поведение площадки, а не форму куки — та проверяется на https-стенде
  APP_ENV: local
  SECRET_KEY: ci-secret-value-at-least-32-characters
  S3_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci
  S3_BUCKET: allstore-ci

jobs:
  lint-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      # для `api-types-fresh`: генератор зовёт openapi-typescript из devDependencies фронта
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint-back

  lint-front:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - run: make lint-front

  lint-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: search/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: search
      - run: make lint-search

  # Без сервисов вообще. Ни один файл в tests/unit не обращается к базе, и это стоит держать
  # правдой: прогон за несколько секунд ловит логику раньше, чем поднимется postgres.
  unit-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      - run: make unit-back
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: backend/.coverage.unit
          include-hidden-files: true
          retention-days: 1

  integration-back:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # тот же образ, что в compose: миграция 0013 создаёт расширение vector, и голому
        # postgres его создавать не из чего
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: allstore
          POSTGRES_PASSWORD: allstore
          POSTGRES_DB: allstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allstore -d allstore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      # общий счётчик лимитера. Без него десять тестов в test_shared_rate_limit.py
      # пропускаются, а лимитер, который никто не гоняет, — лимитер неизвестной формы
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://allstore:allstore@localhost:5432/allstore_test
      # приложение под тестом не должно попадать в общий счётчик — см. tests/conftest.py
      SHARED_TALLY_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      - run: make integration-back
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: backend/.coverage.integration
          include-hidden-files: true
          retention-days: 1

  unit-front:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - run: make unit-front

  unit-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: allstore
          POSTGRES_PASSWORD: allstore
          POSTGRES_DB: allstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allstore -d allstore_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://allstore:allstore@localhost:5432/allstore_test

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: search/uv.lock
      # миграции накатывает backend, поэтому нужны обе среды
      - name: Install dependencies
        run: |
          uv sync --frozen --project backend
          uv sync --frozen --project search
      - run: make unit-search

  # Единственная job с `needs`, и по делу: объединить покрытие двух прогонов иначе нельзя.
  coverage-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [unit-back, integration-back]
    steps:
      # diff-cover сравнивает с базовой веткой, ему нужна история
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: backend
          merge-multiple: true
      - name: Combine
        working-directory: backend
        run: |
          uv run coverage combine .coverage.unit .coverage.integration
          uv run coverage report
          uv run coverage xml
      # Порог пока прежний — покрытие изменённых строк. Храповик на общее число включается
      # отдельным шагом плана, чтобы эта перестройка не меняла поведение.
      - name: Coverage on changed lines
        working-directory: backend
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          uv run diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=80

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_MODERATOR_EMAIL: e2e-moderator@e2e.allstore.am
      E2E_MODERATOR_PASSWORD: e2e-password-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # --wait держит до healthy у postgres, minio и backend; первая страница фронта
      # компилируется по требованию и закрыта таймаутом навигации, а не health-check'ом
      - name: Bring the stack up
        run: docker compose up --build -d --wait
      - name: Moderator account
        run: >-
          docker compose exec -T backend python -m scripts.grant_role
          "$E2E_MODERATOR_EMAIL" "$E2E_MODERATOR_PASSWORD" moderator --reset-password
      - name: Scenario
        run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      # у падения в браузере причина обычно в логах стека, а не в трассировке
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 300

  # Одна галочка для защиты ветки. `always()` — чтобы отменённая или пропущенная job тоже
  # считалась провалом: «не запускалось» не то же самое, что «прошло».
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - lint-back
      - lint-front
      - lint-search
      - unit-back
      - integration-back
      - unit-front
      - unit-search
      - coverage-back
      - e2e
    steps:
      - name: Verdict
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # пробелы в JSON не фиксированы, поэтому не завязываемся на форматирование
          if printf '%s' "$RESULTS" | grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled|skipped)"'; then
            echo "как минимум одна проверка не прошла" >&2
            exit 1
          fi
          echo "все проверки прошли"

[project]
name = "allstore-backend"
version = "0.1.0"
description = "AllStore.am backend API"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "boto3>=1.35",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "boto3-stubs[s3]>=1.35",
    "moto[s3]>=5.2.3",
    "types-psutil>=7.2.2.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ASYNC",
    "ANN",  # annotations
    "S",    # bandit
    "T20",  # no print
    "RUF",
]
ignore = [
    "ANN401",
    # RUF001 targets strings: user-facing text is Russian by product decision.
    # RUF002/RUF003 stay on — they keep docstrings and comments in English.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# tests use literal credentials on purpose; S101 is the assert statement itself
"tests/**" = ["S101", "S105", "S106", "S107"]
"alembic/versions/*" = ["ANN", "D"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]

[[tool.mypy.overrides]]
module = "alembic.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL from the environment",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs ORM internals in a greenlet; without this coverage loses the
# trace function on the first switch and reports executed request code as uncovered
concurrency = ["greenlet", "thread"]
omit = ["app/main.py"]

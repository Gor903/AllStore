[project]
name = "allstore-backend"
version = "0.1.0"
description = "AllStore.am backend API"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "boto3>=1.35",
    "pyjwt>=2.10",
    "python-multipart>=0.0.32",
    "pgvector>=0.5.0",
    # verifies the device-key proofs in services/device_keys.py; already present
    # transitively, named here because the code imports it directly
    "cryptography>=45",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "redis>=5",
    "celery[redis]>=5.5",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "boto3-stubs[s3]>=1.35",
    "moto[s3]>=5.2.3",
    "types-psutil>=7.2.2.20260906",
    "celery-types>=0.26.0",
    "pytest-randomly>=5.1.0",
    "mutmut>=3.8.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "ASYNC",
    "ANN",  # annotations
    "S",    # bandit
    "T20",  # no print
    "RUF",
]
ignore = [
    "ANN401",
    # RUF001 targets strings: user-facing text is Russian by product decision.
    # RUF002/RUF003 stay on — they keep docstrings and comments in English.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# tests use literal credentials on purpose; S101 is the assert statement itself
"tests/**" = ["S101", "S105", "S106", "S107"]
"alembic/versions/*" = ["ANN", "D"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "scripts"]

[[tool.mypy.overrides]]
module = "alembic.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Порядок перемешивается (pytest-randomly). Порядок, на который тесты опираются, — это
# зависимость, о которой никто не знает, пока она не сломается в чужом PR; сид печатается в
# шапке, падение воспроизводится через `--randomly-seed=<сид>`, а заглушается плагин через
# `-p no:randomly` — например, для прогона мутаций.
markers = [
    "integration: requires a live PostgreSQL from the environment",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs ORM internals in a greenlet; without this coverage loses the
# trace function on the first switch and reports executed request code as uncovered
concurrency = ["greenlet", "thread"]
# Branches, not just lines: a line that only ever ran one way through an `if` is a line
# nobody has tested, and the number that says otherwise is the number we would trust.
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The ratchet. Set to what the suite actually reaches and raised as gaps close; a gate set
# above the truth is a gate somebody turns off on their first red Friday.
#
# `app/main.py` is not omitted here: a gate with a silent omission inside it is not the gate
# it claims to be. The module sits at 81% and what is missing is the start-up path.
fail_under = 97

# Мутационное тестирование: мера не покрытия, а того, ловят ли тесты что-нибудь. mutmut
# портит код по одной правке за раз и смотрит, покраснел ли набор. Выживший мутант — строка,
# которую тесты исполняют и не проверяют.
#
# В CI не входит и порога не имеет: это инструмент, которым смотрят на пакет перед тем, как
# его трогать, а не галочка. Как запускать — docs/mutation-testing.md.
[tool.mutmut]
source_paths = ["app/"]
# Из них мутируется то, что покрывают unit-тесты, — зеркально списку scripts/tests-tree-exempt.txt.
# Мутант в маршруте или репозитории выжил бы не потому, что тест плох, а потому, что его
# проверяют интеграционные тесты, которых здесь не запускают: шум, в котором тонет сигнал.
only_mutate = [
    "app/core/*",
    "app/db/*",
    "app/deps/business.py",
    "app/deps/rate_limit.py",
    "app/deps/settings.py",
    "app/deps/tenant.py",
    "app/main.py",
    "app/models/*",
    "app/schemas/*",
    "app/services/assistant/*",
    "app/services/device_keys.py",
    "app/services/search_client.py",
    "app/worker.py",
]
# Только unit: интеграционным нужна база, а прогон на каждый мутант её бы не пережил.
pytest_add_cli_args_test_selection = ["tests/unit/"]
# Порядок фиксирован и покрытие выключено: мутанту нужен быстрый ответ «красный или зелёный»,
# а не отчёт и не свой сид на каждый прогон.
pytest_add_cli_args = ["-p", "no:randomly", "-q", "--no-cov", "-x"]
